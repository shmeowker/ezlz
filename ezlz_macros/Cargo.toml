[package]
name = "ezlz-macros"
version = "0.4.0"
edition = "2024"
rust-version = "1.85.0"
description = "Procedural macros for ezlz"
repository = "https://github.com/shmeowker/ezlz"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1"
syn = { version = "2", features = ["full"] }
