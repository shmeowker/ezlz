# tests/locales/en.yml

messages:
  hello: "Hello, world!"
  greet: "Hello, %{name}!"
  count: "%{name} has %{count} messages."

errors:
  not_found: "Not found"

nested:
  deeply:
    nested:
      value: "Deep value"

plurals:
  russian: "{n| штук| штука|2+ штуки|5+ штук}"
  items: "{n|| штука|2+ штуки|5+ штук|10+ штук}"
  english: "{n| pieces| piece|2+ pieces}"
  item: "{n||1+ item(s)}"
  singular: "{n|| singular}"
  decimal: "{n|.0000}"
  some: "{n|=none|2+=some}"
  exact: "{n|=zero|=one|=two|3+more that two}"
  non_null: "{n||+=not null}"
  before: "{+n||+ is }"

complex: "Hello %{name}, you have {n|| item|+ items} in your %{place}."