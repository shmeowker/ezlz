[workspace]
members = [
    ".",
    "ezlz_macros",
]
resolver = "2"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "benchmarks"
harness = false

[package]
name = "ezlz"
version = "1.1.1"
edition = "2024"
description = "A compact and fast localization engine with language-independent procedural pluralization."
license = "MIT"
repository = "https://github.com/shmeowker/ezlz"
readme = "README.md"

[dependencies]
ahash = "0.8.12"
ezlz-macros = { path = "ezlz_macros", version = "0.2.0" }
itoa = "1.0.18"
serde_yaml = "0.9"
zmij = { version = "1.0.23" }
