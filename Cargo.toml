[workspace]
members = [
    ".",
    "ezlz_macros",
]
resolver = "2"

[package]
name = "ezlz"
version = "3.0.0"
edition = "2024"
rust-version = "1.85.0"
description = "A compact i18n crate."
license = "MIT"
repository = "https://github.com/shmeowker/ezlz"
readme = "README.md"
keywords = ["i18n", "l10n", "pluralization", "localization"]
categories = ["localization", "internationalization"]
exclude = [".github", ".rust-analyzer.toml", "rustfmt.toml", "Cargo.lock", ".gitignore"]

[dependencies]
ahash = "0.8.12"
ezlz-macros = { path = "ezlz_macros", version = "0.3.0" }
itoap = "1.0.1"
serde_yaml = "0.9"
zmij = { version = "1.0.23" }

[features]
default = []
stringify-missing-keys = []
fast-floats = []

[dev-dependencies]
criterion = "0.7"
mimalloc = "0.1.52"

[[bench]]
name = "benchmarks"
harness = false

[package.metadata.docs.rs]
rustdoc-args = ["--document-private-items"]
